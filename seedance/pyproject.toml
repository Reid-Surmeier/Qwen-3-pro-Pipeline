[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seedance-icon-animation-pipeline"
version = "0.1.0"
description = "Evidence-first Seedance pipeline for style-locked icon animation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["httpx>=0.27,<1", "Pillow>=10,<12"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "PyYAML>=6,<7", "ruff>=0.6,<1"]

[project.scripts]
seedance-icons = "seedance_icons.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seedance_icons = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
