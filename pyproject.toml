[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-ui-pipeline"
version = "0.1.0"
description = "Reference-preserving Qwen Image UI generation pipeline"
requires-python = ">=3.12"
dependencies = ["Pillow>=10.2"]

[project.scripts]
qwen-ui-pipeline = "qwen_ui_pipeline.cli:main"
qwen-worker-capacity = "qwen_ui_pipeline.capacity:main"

[tool.setuptools.packages.find]
include = ["qwen_ui_pipeline*"]
