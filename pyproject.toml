[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-ui-pipeline"
version = "0.1.0"
description = "Reference-preserving Qwen Image UI generation pipeline"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<12"]

[project.optional-dependencies]
comfyui = ["torch>=2.2,<3"]
dev = [
  "httpx>=0.27,<1",
  "pre-commit>=4,<5",
  "pytest>=8,<9",
  "PyYAML>=6,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
qwen-ui-pipeline = "qwen_ui_pipeline.cli:main"
qwen-worker-capacity = "qwen_ui_pipeline.capacity:main"

[tool.setuptools.packages.find]
include = ["qwen_ui_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "artifacts",
  "godot/.godot",
  "seedance/docs/evidence",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
