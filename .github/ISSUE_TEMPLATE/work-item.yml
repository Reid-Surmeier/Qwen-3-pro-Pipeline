name: Work item
description: Propose a feature, documentation task, CI change, investigation, or repository chore
title: "[Work]: "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Define the outcome before prescribing implementation. Architectural decisions belong in ADRs.

  - type: dropdown
    id: type
    attributes:
      label: Work type
      options:
        - Feature
        - Documentation
        - CI or repository management
        - Investigation or experiment
        - Maintenance chore
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Problem or desired outcome
      description: What should become possible, safer, clearer, or more reliable?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Current state or evidence
      description: What demonstrates the need? Link sanitized examples, code paths, run manifests, or prior decisions.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Write observable conditions that can be verified.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope boundaries
      placeholder: |
        In scope:
        Out of scope:
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification method
      description: Which deterministic commands, artifacts, metrics, or human review will prove completion?
    validations:
      required: true

  - type: textarea
    id: decisions
    attributes:
      label: Existing decisions and constraints
      description: Link relevant ADRs, interfaces, or policies. Do not silently redefine them here.

  - type: textarea
    id: approvals
    attributes:
      label: Dependencies and human approvals
      description: Identify credentials, paid calls, external side effects, or subjective visual decisions.
