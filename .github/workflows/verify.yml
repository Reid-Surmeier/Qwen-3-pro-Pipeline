name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - release/v0.2.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python and Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@v4
        with:
          # Blind-review packets deliberately verify files from the exact
          # reviewed commit, which can predate the integration merge.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the canonical repository baseline
        run: bash scripts/verify.sh
        env:
          VERIFY_PYTHON: python
